services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: dlc_app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dlc_network

  db:
    image: postgres:16
    container_name: dlc_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dlc_catalog
      POSTGRES_USER: dlc_user
      POSTGRES_PASSWORD: dev_password_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dlc_user -d dlc_catalog"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dlc_network

volumes:
  postgres_data:

networks:
  dlc_network:
    driver: bridge
